
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }
  .app { padding: 1.5rem 0; max-width: 680px; }
  .header { margin-bottom: 1.5rem; }
  .header h1 { font-size: 20px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 4px; }
  .header p { font-size: 14px; color: var(--color-text-secondary); }
  .input-row { display: flex; gap: 8px; margin-bottom: 1rem; }
  .input-row input { flex: 1; font-size: 14px; }
  .input-row button { white-space: nowrap; font-size: 14px; padding: 0 16px; }
  .result-box { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; min-height: 80px; }
  .result-label { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 8px; letter-spacing: 0.04em; text-transform: uppercase; }
  .result-text { font-size: 14px; color: var(--color-text-primary); white-space: pre-wrap; line-height: 1.7; font-family: var(--font-mono); }
  .copy-row { display: flex; justify-content: flex-end; margin-top: 8px; }
  .copy-btn { font-size: 12px; color: var(--color-text-secondary); background: none; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 4px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .copy-btn:hover { background: var(--color-background-secondary); }
  .status { font-size: 13px; color: var(--color-text-secondary); margin-top: 8px; min-height: 20px; }
  .status.loading { color: var(--color-text-info); }
  .status.error { color: var(--color-text-danger); }
  .history { margin-top: 1.5rem; }
  .history-label { font-size: 12px; color: var(--color-text-tertiary); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 8px; }
  .history-item { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 10px 14px; margin-bottom: 6px; cursor: pointer; }
  .history-item:hover { border-color: var(--color-border-secondary); }
  .history-item .hi-title { font-size: 13px; font-weight: 500; color: var(--color-text-primary); }
  .history-item .hi-preview { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .divider { border: none; border-top: 0.5px solid var(--color-border-tertiary); margin: 1.25rem 0; }
</style>

<div class="app">
  <h2 class="sr-only">eBay description maker — enter an item name and model number to generate a listing description</h2>
  <div class="header">
    <h1><i class="ti ti-tag" aria-hidden="true" style="font-size:18px; vertical-align:-2px; margin-right:6px;"></i>eBay Description Maker</h1>
    <p>Enter a brand and model number to generate a ready-to-paste eBay listing description.</p>
  </div>

  <div class="input-row">
    <input type="text" id="itemInput" placeholder="e.g. Kensington K33232" />
    <button id="generateBtn" onclick="generateDescription()">Generate ↗</button>
  </div>

  <div class="status" id="status"></div>

  <div class="result-box" id="resultBox" style="display:none;">
    <div class="result-label">eBay Description</div>
    <div class="result-text" id="resultText"></div>
    <div class="copy-row">
      <button class="copy-btn" onclick="copyResult()"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>
    </div>
  </div>

  <div class="history" id="historySection" style="display:none;">
    <hr class="divider">
    <div class="history-label">Recent listings</div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const history = [];

  async function generateDescription() {
    const input = document.getElementById('itemInput').value.trim();
    if (!input) return;

    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    btn.disabled = true;
    btn.textContent = 'Searching...';
    status.textContent = 'Looking up item on eBay and the web...';
    status.className = 'status loading';
    resultBox.style.display = 'none';

    const systemPrompt = `You are an eBay listing description generator. Your job is to search the web and eBay to identify an item and produce a formatted eBay description.

RULES:
1. Always search the web/eBay to identify the exact item type, specs, and details.
2. Use this format for GENERAL items:
[Brand] [Model #] [Description] ~ [Color if applicable]
Model: [Model #]
Condition: Used. Works Great.

3. For POWER ADAPTERS / POWER SUPPLIES / AC/DC ADAPTERS / SWITCHING ADAPTERS, use:
[Brand] [Model #] [Input specs] [Output specs] [Type - e.g. "Switching Power Supply Adapter" or "AC/DC Power Adapter" or "Power Supply"]
Model: [Model #]
Input: [Input specs]
Output: [Output specs]
Condition: Used. Works Great.

4. Determine the correct adapter type (Switching Power Supply, AC/DC Adapter, Power Adapter, etc.) from real eBay listings and manufacturer info.
5. Title format order: Brand/company first, then model number, then description.
6. Output ONLY the formatted description — no extra commentary, no markdown, no explanation.`;

    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          tools: [{ type: "web_search_20250305", name: "web_search" }],
          system: systemPrompt,
          messages: [{ role: "user", content: `Generate an eBay description for: ${input}` }]
        })
      });

      const data = await response.json();

      const textBlock = data.content && data.content.find(b => b.type === "text");
      const description = textBlock ? textBlock.text.trim() : null;

      if (description) {
        resultText.textContent = description;
        resultBox.style.display = 'block';
        status.textContent = '';
        status.className = 'status';

        history.unshift({ query: input, description });
        if (history.length > 10) history.pop();
        renderHistory();
      } else {
        status.textContent = 'Could not generate a description. Try being more specific.';
        status.className = 'status error';
      }
    } catch (err) {
      status.textContent = 'Error connecting to the API. Please try again.';
      status.className = 'status error';
    }

    btn.disabled = false;
    btn.textContent = 'Generate ↗';
  }

  function copyResult() {
    const text = document.getElementById('resultText').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector('.copy-btn');
      btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> Copied!';
      setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> Copy'; }, 2000);
    });
  }

  function renderHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (history.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = history.map((item, i) => `
      <div class="history-item" onclick="loadHistory(${i})">
        <div class="hi-title">${item.query}</div>
        <div class="hi-preview">${item.description.split('\n')[0]}</div>
      </div>
    `).join('');
  }

  function loadHistory(i) {
    document.getElementById('itemInput').value = history[i].query;
    document.getElementById('resultText').textContent = history[i].description;
    document.getElementById('resultBox').style.display = 'block';
  }

  document.getElementById('itemInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') generateDescription();
  });
</script>
